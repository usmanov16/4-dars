<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__logo">
        <img src="./assets/logo.svg" alt="" />
      </div>
      <div>
        <a class="header__btn btn" href="#">Free Consultation</a>
      </div>
    </header>
    <main class="main">
      <!-- Services -->
      <section class="services">
        <div class="services__container container">
          <div class="services__about">
            <h2 class="services__title title">Design solutions made easy</h2>
            <p class="services__description">
              With over ten years of experience in various design disciplines,
              I’m your one-stop shop for your design needs.
            </p>
          </div>
          <div class="services__list">
            <div class="services__flex-1">
              <div class="services__item services__graphic">
                <p class="services__item-description title">Graphic Design</p>
              </div>
            </div>
            <div class="services__flex-2">
              <div class="services__flex-items">
                <div class="services__item services__uiux">
                  <p class="services__item-description title">UI/UX</p>
                </div>
                <div class="services__item services__apps">
                  <p class="services__item-description title">Apps</p>
                </div>
              </div>
              <div class="services__item services__illustration">
                <p class="services__item-description title">Illustrations</p>
              </div>
            </div>
            <div class="services__flex-3">
              <div class="services__item services__photo">
                <p class="services__item-description title">Photography</p>
              </div>
              <div class="services__item services__motion">
                <p class="services__item-description title">Motion Graphics</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
